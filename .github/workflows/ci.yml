name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, build e testes unitários (cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - name: Testes unitários + gate de cobertura (>= 80%)
        run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura
          path: coverage/

  integracao:
    name: Testes de integração (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oficina_test
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oficina -d oficina_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://oficina:oficina@localhost:5432/oficina_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e

  seguranca:
    name: Análise de vulnerabilidades
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (falha em high/critical)
        run: npm audit --audit-level=high
      - name: Relatório npm audit
        if: always()
        run: npm run audit:report
      # Trivy roda pela imagem oficial fixada por digest. A aquasecurity/trivy-action
      # depende de um instalador que baixa de get.trivy.dev, domínio que deixou de
      # resolver (curl exit 6) — a imagem Docker não tem esse ponto de falha.
      - name: Trivy - dependências, segredos e configurações (fs)
        run: |
          set +e
          docker run --rm -v "$PWD":/src -v "$HOME/.cache/trivy":/root/.cache/trivy "$TRIVY_IMAGE" \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs /src/node_modules --exit-code 1 --format table --output /src/trivy-fs.txt /src
          rc=$?
          cat trivy-fs.txt
          exit $rc
      - name: Build da imagem
        if: always()
        run: docker build -t oficina-api:ci .
      - name: Trivy - imagem Docker
        if: always()
        run: |
          set +e
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/src \
            -v "$HOME/.cache/trivy":/root/.cache/trivy "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --format table --output /src/trivy-image.txt oficina-api:ci
          rc=$?
          cat trivy-image.txt
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-seguranca
          path: |
            trivy-fs.txt
            trivy-image.txt
            docs/seguranca/relatorio-vulnerabilidades.md
